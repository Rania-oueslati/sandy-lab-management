<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🌊 Treedome Lab • Sandy Cheeks AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@500;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('/images/treedome.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Fredoka', 'Baloo 2', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
    }

    .app-layout {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 88vh;
      max-height: 950px;
      gap: 20px;
      z-index: 2;
    }

    .sidebar {
      width: 280px;
      background: rgba(14, 59, 78, 0.6);
      backdrop-filter: blur(18px);
      border-radius: 30px;
      border: 3px solid rgba(112, 201, 255, 0.4);
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      overflow-y: auto;
    }

    .nav-section-title {
      color: #70c9ff;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    .nav-tab {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 15px;
      border-radius: 15px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-tab.active {
      background: rgba(251, 139, 36, 0.2);
      border-color: #fb8b24;
      color: #ffe28c;
    }

    .divider {
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      margin: 15px 0;
      border-radius: 2px;
    }

    .new-chat-btn {
      background: #fb8b24;
      border: 2px solid #ffe28c;
      border-radius: 20px;
      padding: 12px;
      color: #2d1f08;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-session {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 15px;
      border-radius: 15px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .chat-session-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat-btn {
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid rgba(255, 100, 100, 0.4);
      color: #ffcccc;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .delete-chat-btn:hover {
      background: rgba(255, 50, 50, 0.8);
      color: white;
    }

    .chat-session:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .chat-session.active {
      background: rgba(112, 201, 255, 0.3);
      border-color: #70c9ff;
    }

    .clear-all-btn {
      background: rgba(255, 80, 80, 0.8);
      border: 2px solid #ffaaaa;
      border-radius: 15px;
      padding: 10px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 15px;
      transition: all 0.2s;
    }

    .clear-all-btn:hover {
      background: #ff3333;
      transform: translateY(-2px);
    }

    .treedome-container {
      flex: 1;
      height: 100%;
      background: rgba(206, 240, 255, 0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 60px 60px 50px 50px;
      border: 3px solid rgba(255, 255, 200, 0.7);
      box-shadow: 0 30px 45px rgba(0, 20, 40, 0.7), inset 0 0 30px rgba(255, 255, 180, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Views */
    .view-container {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .view-container.active {
      display: flex;
    }

    /* Inventory Table Styles */
    .inventory-wrapper {
      padding: 30px;
      overflow-y: auto;
      flex: 1;
    }

    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .inventory-table th {
      background: #32735b;
      color: #ffe28c;
      padding: 15px;
      text-align: left;
      font-size: 1.1rem;
    }

    .inventory-table td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      color: #1e3b2f;
      font-weight: 600;
    }

    .inventory-table tr:last-child td {
      border-bottom: none;
    }

    .inventory-table tr:hover {
      background: rgba(251, 139, 36, 0.1);
    }

    .status-badge {
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }

    /* dome glass effect */
    .treedome-container::after {
      content: "";
      position: absolute;
      top: -20px;
      left: 10%;
      width: 80%;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.8) 0%, transparent 80%);
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
    }

    .chat-header {
      background: rgba(0, 100, 80, 0.4);
      backdrop-filter: blur(8px);
      padding: 18px 25px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 3px solid #f7e05e;
      position: relative;
      background-image: linear-gradient(0deg, #2d8b6e, #40a582);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }

    .avatar {
      width: 70px;
      height: 70px;
      background: #ffe9b6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffb347;
      box-shadow: 0 0 0 4px rgba(255,255,200,0.8), 0 10px 15px rgba(0,0,0,0.3);
      overflow: hidden;
      background-image: radial-gradient(circle at 30% 30%, #fff3cf, #fdcb6e);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-text h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffecaa;
      text-shadow: 3px 3px 0 #a0522d, 5px 5px 0 rgba(0,0,0,0.3);
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 4px;
      font-family: 'Baloo 2', cursive;
    }

    .header-text p {
      font-size: 1rem;
      font-weight: 600;
      color: #fef9d7;
      background: rgba(44, 62, 28, 0.6);
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: rgba(171, 219, 227, 0.2);
      backdrop-filter: blur(4px);
      scroll-behavior: smooth;
    }

    /* custom scroll */
    .chat-messages::-webkit-scrollbar {
      width: 10px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #88c9b5;
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #f9d56e;
      border-radius: 10px;
      border: 2px solid #b45f2a;
    }

    .message {
      max-width: 80%;
      padding: 16px 22px;
      border-radius: 30px 30px 30px 8px;
      font-weight: 500;
      line-height: 1.5;
      word-wrap: break-word;
      animation: bubblePop 0.3s ease-out;
      box-shadow: 0 8px 12px rgba(0,0,0,0.2);
      position: relative;
      font-size: 1.05rem;
    }

    @keyframes bubblePop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .message.sandy {
      background: #ffeac2;
      background-image: linear-gradient(145deg, #ffd78b, #ffb85c);
      align-self: flex-start;
      border: 3px solid #d9722a;
      color: #2d1c0c;
      border-top-left-radius: 6px;
      font-weight: 600;
      box-shadow: 4px 8px 0 #b45f2a, 0 10px 15px rgba(0,0,0,0.25);
      margin-left: 5px;
    }

    .message.sandy::before {
      content: "🐿️";
      position: absolute;
      left: -28px;
      top: -8px;
      font-size: 1.8rem;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
    }

    .message.user {
      background: #ecf7ff;
      background-image: linear-gradient(150deg, #b3e0ff, #6fc8ff);
      align-self: flex-end;
      border: 3px solid #2376a5;
      color: #002b4d;
      border-top-right-radius: 6px;
      font-weight: 600;
      box-shadow: -4px 8px 0 #0f4b6e, 0 10px 15px rgba(0,0,0,0.3);
      margin-right: 5px;
    }

    .message.user::after {
      content: "🧽";
      position: absolute;
      right: -28px;
      top: -12px;
      font-size: 2rem;
      filter: drop-shadow(0 6px 4px #b8860b);
    }

    .loading-indicator {
      align-self: flex-start;
      background: #f7e39c;
      padding: 12px 24px;
      border-radius: 30px;
      color: #5c3b1a;
      font-weight: 700;
      display: none;
      gap: 10px;
      align-items: center;
      border: 2px dashed #b5651d;
      background: #fef3c7;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 4px solid #a0522d;
      border-top: 4px solid #ffe484;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .chat-footer {
      padding: 18px 24px;
      background: #32735b;
      border-top: 4px solid #fedb5f;
      display: flex;
      gap: 14px;
      backdrop-filter: blur(10px);
    }

    .chat-footer input {
      flex: 1;
      background: #fefae0;
      border: 3px solid #bc6c25;
      border-radius: 40px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e3b2f;
      outline: none;
      font-family: 'Fredoka', sans-serif;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.1), 0 6px 0 #835030;
      transition: all 0.1s ease;
    }

    .chat-footer input:focus {
      border-color: #ffb703;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.1), 0 6px 0 #835030, 0 0 0 4px rgba(255,215,0,0.5);
    }

    .chat-footer button {
      background: #fb8b24;
      border: none;
      border-radius: 50px;
      padding: 0 32px;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #2d1f08;
      background: radial-gradient(circle at 20% 30%, #ffbc5e, #e07b1f);
      border: 3px solid #ffe28c;
      box-shadow: 0 8px 0 #9e4f1c, 0 10px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: 0.05s linear;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'Baloo 2', cursive;
    }

    .chat-footer button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #9e4f1c, 0 8px 12px rgba(0,0,0,0.3);
      background: radial-gradient(circle at 20% 30%, #fdaa44, #c96b1a);
    }

    @media (max-width: 550px) {
      .header-text h1 {
        font-size: 1.7rem;
      }
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fefae0;
      border: 4px solid #bc6c25;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #bc6c25;
      margin-bottom: 15px;
    }
    .modal-text {
      font-size: 1.1rem;
      color: #2d1f08;
      margin-bottom: 25px;
    }
    .modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .modal-buttons button {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }
    .modal-btn-cancel {
      background: #ccc;
      color: #333;
    }
    .modal-btn-confirm {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-section-title">Roles & Dashboards</div>
      <div class="nav-tab active" id="tabAiChat" onclick="switchTab('ai-chat')">
        🐿️ AI Assistant
      </div>
      <div class="nav-tab" id="tabInventory" onclick="switchTab('inventory'); fetchInventory();">
        📦 Lab Inventory
      </div>

      <div class="divider"></div>

      <div class="nav-section-title">AI Chat Logs</div>
      <button class="new-chat-btn" id="newChatBtn">➕ New Lab Log</button>
      <div class="chat-list" id="chatList">
        <!-- Sessions will be populated here -->
      </div>
      <button class="clear-all-btn" id="clearAllBtn">🗑️ Clear All Data</button>
    </div>

    <!-- Main Content Area -->
    <div class="treedome-container">
      
      <!-- AI Chat View -->
      <div id="ai-chat" class="view-container active">
        <!-- Sandy Header -->
        <div class="chat-header">
          <div class="avatar">
            <img src="/images/sandy_avatar.png" alt="Sandy Cheeks squirrel" 
                 onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23e5b56c%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22black%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22black%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22%23442b14%22%3E🐿️%3C/text%3E%3C/svg%3E';">
          </div>
          <div class="header-text">
            <h1>Sandy Cheeks</h1>
            <p>🤠 Treedome Lab • Lead Scientist AI</p>
          </div>
        </div>

        <!-- Messages area -->
        <div class="chat-messages" id="messagesContainer">
          <!-- Messages populated by JS -->
        </div>

        <!-- Loading spinner -->
        <div class="loading-indicator" id="loadingBox">
          <img src="https://media.discordapp.net/attachments/1190462107167240202/1497777181814816818/0426_online-video-cutter.com.gif?ex=69eec133&is=69ed6fb3&hm=42bf7fd0b98466f2aa2828e31dccf65cab7ac4a3ecb3c48f274ee15f37c232cf&=&width=464&height=350" style="height:40px; border-radius:10px;" alt="Sandy Thinking" /> Sandy's thinkin'...
        </div>

        <!-- Input -->
        <div class="chat-footer">
          <input type="text" id="userInput" placeholder="Ask Sandy something..." autocomplete="off" />
          <button id="sendBtn">📨 SEND</button>
        </div>
      </div>

      <!-- Inventory Dashboard View -->
      <div id="inventory" class="view-container">
        <div class="chat-header">
          <div class="avatar" style="background-image: none; background: #6ee7b7; border-color: #059669;">
            <span style="font-size: 2.5rem;">📦</span>
          </div>
          <div class="header-text">
            <h1>Lab Inventory</h1>
            <p>📋 Treedome Lab • Real-Time Database</p>
          </div>
        </div>
        <div class="inventory-wrapper">
          <div style="background: rgba(255,255,255,0.8); padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <input type="text" id="manualItemName" placeholder="New item name..." style="flex: 1; padding: 10px; border-radius: 8px; border: 2px solid #32735b; font-family: 'Fredoka';" />
            <input type="number" id="manualItemQty" placeholder="Qty" value="1" style="width: 80px; padding: 10px; border-radius: 8px; border: 2px solid #32735b; font-family: 'Fredoka';" />
            <button onclick="manualAdd()" style="background: #fb8b24; color: #2d1f08; border: 2px solid #ffe28c; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Add Item</button>
            <button onclick="manualClearAll()" style="background: #ef4444; color: white; border: 2px solid #b91c1c; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Clear All</button>
          </div>
          <table class="inventory-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <tr><td colspan="6" style="text-align:center;">Loading inventory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Custom Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Confirm Action</div>
      <div class="modal-text" id="modalText">Are you sure?</div>
      <div class="modal-buttons">
        <button class="modal-btn-cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn-confirm" id="modalConfirmBtn">Yes, do it</button>
      </div>
    </div>
  </div>

  <script>
  
    let currentConfirmCallback = null;
    const modalOverlay = document.getElementById('customModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');

    function showModal(title, text, callback, isAlert = false) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      currentConfirmCallback = callback;
      
      const cancelBtn = document.getElementById('modalCancelBtn');
      const confirmBtn = document.getElementById('modalConfirmBtn');
      if (isAlert) {
        cancelBtn.style.display = 'none';
        confirmBtn.textContent = 'OK';
      } else {
        cancelBtn.style.display = 'block';
        confirmBtn.textContent = 'Yes, do it';
      }
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      currentConfirmCallback = null;
    }

    document.getElementById('modalCancelBtn').onclick = closeModal;
    document.getElementById('modalConfirmBtn').onclick = () => {
      if (currentConfirmCallback) currentConfirmCallback();
      closeModal();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      
      if (tabId === 'ai-chat') {
        document.getElementById('tabAiChat').classList.add('active');
      } else if (tabId === 'inventory') {
        document.getElementById('tabInventory').classList.add('active');
      }
    }

    async function fetchInventory() {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading inventory from database...</td></tr>';
      
      try {
        const response = await fetch('/api/inventory');
        const items = await response.json();
        
        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Inventory is completely empty! Add items above or ask your assistant.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        items.forEach(item => {
          const tr = document.createElement('tr');
          const status = item.quantity > 0 ? '<span class="status-badge" style="background:#dcfce7;color:#166534;border-color:#86efac;">In Stock</span>' : '<span class="status-badge" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5;">Out of Stock</span>';
          
          tr.innerHTML = `
            <td>#${item.id}</td>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td>${item.quantity} ${item.unit || ''}</td>
            <td>${status}</td>
            <td style="display: flex; gap: 5px;">
              <button onclick="updateQty('${item.name}', 1)" style="background: #10b981; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-weight: bold;">+</button>
              <button onclick="updateQty('${item.name}', -1)" style="background: #f59e0b; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-weight: bold;">-</button>
              <button onclick="deleteItem('${item.id}')" style="background: #ef4444; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-weight: bold;">X</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">Error connecting to database!</td></tr>';
      }
    }

   
    window.switchTab = switchTab;
    window.fetchInventory = fetchInventory;

    window.manualAdd = async function() {
      const name = document.getElementById('manualItemName').value.trim();
      const qty = parseInt(document.getElementById('manualItemQty').value);
      if (!name || isNaN(qty)) return showModal('Hold your horses!', 'Please enter a valid name and quantity.', null, true);
      
      await fetch('/api/inventory/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: name, changeAmount: qty })
      });
      document.getElementById('manualItemName').value = '';
      fetchInventory();
    };

    window.updateQty = async function(name, change) {
      await fetch('/api/inventory/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: name, changeAmount: change })
      });
      fetchInventory();
    };

    window.deleteItem = async function(id) {
      showModal('Delete Item', 'Are you sure you want to delete this item from the lab inventory?', async () => {
        await fetch('/api/inventory/' + id, { method: 'DELETE' });
        fetchInventory();
      });
    };

    window.manualClearAll = async function() {
      showModal('Clear Inventory', 'Are you sure you want to delete ALL inventory items? This cannot be undone!', async () => {
        await fetch('/api/inventory', { method: 'DELETE' });
        fetchInventory();
      });
    };

    (function() {
      const messagesContainer = document.getElementById('messagesContainer');
      const userInput = document.getElementById('userInput');
      const sendButton = document.getElementById('sendBtn');
      const loadingBox = document.getElementById('loadingBox');
      const chatList = document.getElementById('chatList');
      const newChatBtn = document.getElementById('newChatBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');

      
      let sessions = JSON.parse(localStorage.getItem('treedome_sessions')) || [];
      let currentSessionId = null;

      const welcomeMessage = "🌵 Howdy, partner! Sandy Cheeks here in the Treedome. Ask me about inventory, karate, or science stuff! Yeehaw!";

      function saveSessions() {
        localStorage.setItem('treedome_sessions', JSON.stringify(sessions));
        renderSidebar();
      }

      function createNewSession() {
        currentSessionId = Date.now().toString();
        sessions.unshift({
          id: currentSessionId,
          title: "New Lab Log",
          messages: [{ text: welcomeMessage, sender: 'sandy' }]
        });
        saveSessions();
        renderMessages();
        switchTab('ai-chat');
      }

      function deleteSession(id, event) {
        event.stopPropagation(); // Prevent loading the session when clicking delete
        sessions = sessions.filter(s => s.id !== id);
        
        if (sessions.length === 0) {
          createNewSession();
        } else if (currentSessionId === id) {
          currentSessionId = sessions[0].id;
          saveSessions();
          renderMessages();
        } else {
          saveSessions();
        }
      }

      function clearAllData() {
        showModal('Clear Chat Logs', 'Are you sure you want to delete all chat history? This cannot be undone!', () => {
          sessions = [];
          createNewSession();
        });
      }

      function loadSession(id) {
        currentSessionId = id;
        renderSidebar();
        renderMessages();
        switchTab('ai-chat');
      }

      function renderSidebar() {
        chatList.innerHTML = '';
        sessions.forEach(session => {
          const div = document.createElement('div');
          div.className = `chat-session ${session.id === currentSessionId ? 'active' : ''}`;
          div.onclick = () => loadSession(session.id);
          
          const titleSpan = document.createElement('span');
          titleSpan.className = 'chat-session-title';
          titleSpan.textContent = session.title;
          
          const deleteBtn = document.createElement('div');
          deleteBtn.className = 'delete-chat-btn';
          deleteBtn.textContent = '✖';
          deleteBtn.onclick = (e) => deleteSession(session.id, e);
          
          div.appendChild(titleSpan);
          div.appendChild(deleteBtn);
          chatList.appendChild(div);
        });
      }

      function renderMessages() {
        messagesContainer.innerHTML = '';
        const session = sessions.find(s => s.id === currentSessionId);
        if (session) {
          session.messages.forEach(msg => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.sender}`;
            messageDiv.textContent = msg.text;
            messagesContainer.appendChild(messageDiv);
          });
        }
        scrollToBottom();
      }

      
      if (sessions.length === 0) {
        createNewSession();
      } else {
        currentSessionId = sessions[0].id;
        renderSidebar();
        renderMessages();
      }

      newChatBtn.onclick = createNewSession;
      clearAllBtn.onclick = clearAllData;

      function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        messageDiv.textContent = text;
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();

       
        const session = sessions.find(s => s.id === currentSessionId);
        if (session) {
          session.messages.push({ text, sender });
          
          if (sender === 'user' && session.title === "New Lab Log") {
            session.title = text.substring(0, 25) + (text.length > 25 ? "..." : "");
          }
          saveSessions();
        }
      }

      function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function setLoading(show) {
        loadingBox.style.display = show ? 'flex' : 'none';
        if (show) scrollToBottom();
      }

      async function handleSendMessage() {
        const queryText = userInput.value.trim();
        if (queryText === '') return;

        addMessage(queryText, 'user');
        userInput.value = '';
        setLoading(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: queryText })
          });

          setLoading(false);

          if (response.ok) {
            const data = await response.json();
            if (data && data.response) {
              addMessage(data.response, 'sandy');
            } else {
              addMessage("Hoo-wee! Somethin' went wrong in the lab.", 'sandy');
            }
          } else {
            throw new Error('API not ok');
          }
        } catch (error) {
          setLoading(false);
          addMessage("Tarnation! Connection failed. Check your Node server.", 'sandy');
        }
      }

      sendButton.addEventListener('click', handleSendMessage);
      userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSendMessage();
        }
      });

      userInput.focus();
    })();
  </script>
</body>
</html>
